<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dice Roller</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;min-height:100svh;display:grid;place-items:center;font-family:Arial,sans-serif;padding:32px 20px}.content{display:flex;flex-direction:column;align-items:center;gap:60px}.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,4vw,38px)}.die{position:relative;border:5px solid white;width:clamp(56px,18vw,140px);height:clamp(56px,18vw,140px);border-radius:26px;background:var(--color);box-shadow:0 8px 0 color-mix(in srgb,var(--color),black 30%),0 22px 35px #0008;transform:rotate(-7deg);padding:25px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px}.die:nth-child(even){transform:rotate(7deg)}.die::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18%;height:18%;background:white;border-radius:50%}.pip{display:none;background:#17181c;border-radius:50%;visibility:hidden}.on{visibility:visible}button{display:grid;place-items:center;background:#292b32;color:#f5f5f7;border:1px solid #3c3f48;border-radius:18px;width:200px;height:64px;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}button:hover{background:#3a3d47;transform:translateY(-2px)}button:focus-visible{outline:3px solid #a6b5ff;outline-offset:6px}button:disabled{opacity:.6;cursor:wait}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}.die.rolling{animation:tumble .15s infinite alternate}.die:nth-child(even).rolling{animation-direction:alternate-reverse}@keyframes tumble{from{transform:rotate(-20deg) translateY(-8px)}to{transform:rotate(20deg)}}@media(max-width:600px){.die{border-radius:18px;padding:0}}@media(prefers-reduced-motion:reduce){.die.rolling{animation:none}button{transition:none}}
.color-options{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:600px;margin-top:-32px}.color-option{width:auto;min-width:82px;height:48px;padding:0 14px;border:2px solid var(--choice);border-radius:12px;color:var(--choice);font-size:14px;gap:6px;display:flex;justify-content:center}.color-option[aria-pressed="true"]{background:var(--choice);color:#101114;box-shadow:0 0 0 3px #fff}.check{display:inline-block;width:16px}.color-option:hover{background:#3a3d47}.color-option[aria-pressed="true"]:hover{background:var(--choice)}</style></head><body><main class="content"><div class="dice" id="dice" aria-label="Four dice"></div><button id="roll" type="button">Roll the dice</button><div class="color-options" role="group" aria-label="Choose a color to restrict" id="color-options"></div><div id="result" class="sr-only" role="status" aria-live="polite"></div></main><script>
const container=document.getElementById('dice'),button=document.getElementById('roll'),result=document.getElementById('result');const faces={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]},colors=['#f15b64','#f6d64c','#f59b44','#59c788','#5b9ef4','#b184ef'],names=['red','yellow','orange','green','blue','purple'];let busy=false,selectedColor=null;const options=document.getElementById('color-options');names.forEach((name,i)=>{const option=document.createElement('button');option.type='button';option.className='color-option';option.style.setProperty('--choice',colors[i]);option.setAttribute('aria-pressed','false');const check=document.createElement('span');check.className='check';check.setAttribute('aria-hidden','true');option.append(check,document.createTextNode(name[0].toUpperCase()+name.slice(1)));option.addEventListener('click',()=>{selectedColor=i+1;[...options.children].forEach((b,j)=>{b.setAttribute('aria-pressed',String(j===i));b.querySelector('.check').textContent=j===i?String.fromCharCode(10003):''})});options.appendChild(option)});const dice=Array.from({length:4},(_,index)=>{const die=document.createElement('div');die.className='die';die.setAttribute('role','img');for(let i=0;i<9;i++){let pip=document.createElement('span');pip.className='pip';die.appendChild(pip)}container.appendChild(die);return die});function show(die,n,index){[...die.children].forEach((pip,i)=>pip.classList.toggle('on',faces[n].includes(i)));die.style.setProperty('--color',colors[n-1]);die.setAttribute('aria-label','Die '+(index+1)+': '+n+', '+names[n-1])}function random(){const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1}function roll(){if(busy)return;busy=true;button.disabled=true;dice.forEach(d=>d.classList.add('rolling'));result.textContent='';const timer=setInterval(()=>dice.forEach((d,i)=>show(d,random(),i)),75);setTimeout(()=>{clearInterval(timer);let values;do{values=Array.from({length:4},random)}while(selectedColor!==null&&[1,4].includes(values.filter(n=>n===selectedColor).length));dice.forEach((d,i)=>{show(d,values[i],i);d.classList.remove('rolling')});result.textContent='You rolled '+values.join(', ')+'.';button.disabled=false;busy=false},650)}button.addEventListener('click',roll);document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();roll()}});dice.forEach((d,i)=>show(d,i+1,i));
</script></body></html>
